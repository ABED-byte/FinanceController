spring.application.name=finance-tracker

# MySQL — server must be running; fix user/password if needed
spring.datasource.url=jdbc:mysql://localhost:3306/finance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Explicit dialect avoids "Unable to determine Dialect without JDBC metadata" when metadata is unavailable at init
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Binds to JwtProperties (field: secret) — optional env override
jwt.secret=${JWT_SECRETKEY}
jwt.expiration-ms=86400000



# logging.level.org.springframework.security=DEBUG1
