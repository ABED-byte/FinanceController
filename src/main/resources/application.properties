spring.application.name=finance-tracker

# MySQL — server must be running; fix user/password if needed
spring.datasource.url=jdbc:postgresql://dpg-XXXX/backeddb_q4py
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Binds to JwtProperties (field: secret) — optional env override
jwt.secret=${JWT_SECRETKEY}
jwt.expiration-ms=86400000

# Redis configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Cache configuration
spring.cache.type=redis
spring.cache.cache-names=dashboard_summary,dashboard_trends,categories
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=finance_tracker:
spring.cache.redis.use-key-prefix=true



# logging.level.org.springframework.security=DEBUG1
